name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  server-syntax:
    name: Server syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check all server JS
        run: >-
          find server -name '*.js' -not -path '*/node_modules/*' -print0
          | xargs -0 -n1 node --check

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build
